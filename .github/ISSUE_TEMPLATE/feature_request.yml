name: 功能建议
description: 提议一个新的使用场景或改进方向
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请先描述使用场景和当前遇到的困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 Tabstead 如何处理这个问题？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如果尝试过替代方案，可以在这里说明。
